name: Manual Deploy to Render.com

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      
jobs:
  deploy:
    name: Manual Deploy to Render
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build (if needed)
        run: npm run build --if-present
      
      - name: Deploy to Render.com
        uses: ttskch/render-deploy@v1.0.0
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-deploy: true
      
      - name: Health Check
        run: |
          echo "⏳ Waiting for service to be ready..."
          sleep 30
          echo "🏥 Checking health endpoint..."
          curl -f https://ai-product-analyzer.onrender.com/api/health || exit 1
          echo "✅ Health check passed!"
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- [V2 Pro](https://ai-product-analyzer.onrender.com/v2)" >> $GITHUB_STEP_SUMMARY
          echo "- [V1 Classic](https://ai-product-analyzer.onrender.com/v1)" >> $GITHUB_STEP_SUMMARY
          echo "- [Health Check](https://ai-product-analyzer.onrender.com/api/health)" >> $GITHUB_STEP_SUMMARY
